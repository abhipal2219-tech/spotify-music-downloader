<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Music Downloader</title>
    <meta name="description" content="Download your favorite tracks with retro style.">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Retro Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['Chakra Petch', 'monospace']
                    },
                    colors: {
                        retro: { 
                            bg: '#9fa688',      // Sage/Olive Green from the image
                            card: '#8c9576',    // Slightly darker for contrast
                            text: '#111111',    // Stark black
                            accent: '#FF5E00',  // Bright orange action
                            accentHover: '#E65500' 
                        }
                    },
                    boxShadow: {
                        'brutal': '4px 4px 0px #111111',
                        'brutal-sm': '2px 2px 0px #111111',
                        'brutal-inset': 'inset 4px 4px 0px rgba(17,17,17,0.1)'
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #9fa688; 
            color: #111111;
            /* subtle noise overlay for retro feel */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }
        
        /* Brutalist Button Physics */
        .btn-brutal {
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px #111111;
            transition: all 0.1s ease;
        }
        .btn-brutal:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #111111;
        }
        .btn-brutal:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #111111;
        }
        
        /* Retro Input */
        .input-brutal {
            border: 2px solid #111111;
            background: #e4e6dc;
            box-shadow: inset 4px 4px 0px rgba(17, 17, 17, 0.05);
        }
        .input-brutal:focus {
            outline: none;
            background: #f0f2ea;
        }

        /* Loading Bar Striping */
        .stripes {
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(17,17,17,0.2) 10px,
                rgba(17,17,17,0.2) 20px
            );
            background-size: 28px 28px;
            animation: moveStripes 1s linear infinite;
        }
        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 28px 0; }
        }
        
        /* Technical lines */
        .tech-line {
            height: 2px;
            background-color: #111111;
            flex-grow: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-display selection:bg-retro-accent selection:text-white">
    <!-- Top HUD Bar -->
    <div class="w-full flex justify-between items-center p-4 text-xs font-mono font-bold tracking-widest uppercase border-b-2 border-retro-text sticky top-0 bg-transparent z-10 hidden sm:flex">
        <div>MUSIC PLAYER HF-S 800</div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-retro-text"></span> RECORD START</div>
            <div class="w-24 h-0.5 bg-retro-text"></div>
        </div>
        <div>TYPE 1 NORMAL POSITION</div>
    </div>

    <div id="root" class="w-full max-w-2xl mx-auto flex-grow flex flex-col justify-center p-4 sm:p-6 lg:p-8"></div>

    <!-- Bottom HUD Bar -->
    <div class="w-full flex justify-between items-end p-4 text-[10px] sm:text-xs font-mono font-bold tracking-widest uppercase border-t-2 border-retro-text mt-auto">
        <div>
            <div>XX1 NDFR - 00 NMB 00001 <span class="ml-4">2026</span></div>
            <div>IDENTIFICATION NUMBER - 06746HDFGFS634523</div>
        </div>
        <div class="text-right hidden sm:block">000000003214</div>
    </div>

    <script type="text/babel">
        const { useState, useCallback } = React;

        const API = window.location.origin;

        function App() {
            const [url, setUrl] = useState('');
            const [quality, setQuality] = useState('mp3');
            const [meta, setMeta] = useState(null);
            const [fetching, setFetching] = useState(false);
            const [downloading, setDownloading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [status, setStatus] = useState('');
            const [error, setError] = useState('');

            const fetchMeta = useCallback(async () => {
                if (!url.trim()) return;
                setFetching(true); setMeta(null); setError('');
                try {
                    const r = await fetch(`${API}/metadata?url=${encodeURIComponent(url)}`);
                    if (r.ok) { setMeta(await r.json()); }
                    else { setError('COULD NOT FETCH DATA. VERIFY URL OR CREDENTIALS.'); }
                } catch { setError('SERVER OFFLINE.'); }
                finally { setFetching(false); }
            }, [url]);

            const startDownload = () => {
                setDownloading(true); setProgress(0); setStatus('ESTABLISHING CONNECTION...'); setError('');
                const es = new EventSource(`${API}/download?url=${encodeURIComponent(url)}&quality=${quality}`);
                es.onmessage = (e) => {
                    const d = JSON.parse(e.data);
                    if (d.status === 'downloading') { setProgress(d.progress); setStatus(`DOWNLOADING DATA [${d.progress.toFixed(1)}%]`); }
                    else if (d.status === 'finished') { setProgress(100); setStatus('PROCESSING AUDIO MATRIX...'); }
                    else if (d.status === 'complete') { setStatus('TRANSMISSION COMPLETE.'); setDownloading(false); es.close(); }
                };
                es.onerror = () => { setError('TRANSMISSION FAILED.'); setDownloading(false); es.close(); };
            };

            return (
                <div className="space-y-8 w-full relative">
                    {/* Giant background text (optional flair from the image) */}
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[10rem] font-bold text-retro-text opacity-5 select-none pointer-events-none whitespace-nowrap z-[-1]">
                        ASH TR
                    </div>

                    {/* Main Title Block */}
                    <div className="flex flex-col items-center text-center">
                        <div className="flex items-center gap-4 w-full justify-center mb-2">
                            <svg className="w-8 h-8 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/><circle cx="12" cy="12" r="1.5"/></svg>
                            <h1 className="text-4xl sm:text-5xl md:text-6xl font-black uppercase tracking-tighter">
                                SOUNDEX
                            </h1>
                            <svg className="w-8 h-8 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/><circle cx="12" cy="12" r="1.5"/></svg>
                        </div>
                        <div className="font-mono text-xs font-bold tracking-widest uppercase border-t-2 border-b-2 border-retro-text py-1 px-8 inline-block">
                            AUDIO EXTRACTION UTILITY
                        </div>
                    </div>

                    {/* Central Brutalist Card */}
                    <div className="bg-retro-card border-4 border-retro-text p-6 sm:p-8 relative z-0">
                        {/* Screws/Details */}
                        <div className="absolute top-2 left-2 w-3 h-3 border-2 border-retro-text rounded-full flex items-center justify-center"><div className="w-full h-0.5 bg-retro-text rotate-45"></div></div>
                        <div className="absolute top-2 right-2 w-3 h-3 border-2 border-retro-text rounded-full flex items-center justify-center"><div className="w-full h-0.5 bg-retro-text -rotate-45"></div></div>
                        <div className="absolute bottom-2 left-2 w-3 h-3 border-2 border-retro-text rounded-full flex items-center justify-center"><div className="w-full h-0.5 bg-retro-text -rotate-45"></div></div>
                        <div className="absolute bottom-2 right-2 w-3 h-3 border-2 border-retro-text rounded-full flex items-center justify-center"><div className="w-full h-0.5 bg-retro-text rotate-45"></div></div>

                        <div className="space-y-6 mt-4 relative z-10">
                            {/* Input Area */}
                            <div>
                                <label className="block font-mono text-xs font-bold mb-2 uppercase">Target Coordinates (URL)</label>
                                <div className="relative">
                                    <input
                                        type="text"
                                        placeholder="https://open.spotify.com/track/..."
                                        className="w-full input-brutal p-4 font-mono text-sm placeholder:text-retro-text/40"
                                        value={url}
                                        onChange={e => setUrl(e.target.value)}
                                        onBlur={fetchMeta}
                                        onKeyDown={e => e.key === 'Enter' && fetchMeta()}
                                    />
                                    {fetching && (
                                        <div className="absolute right-4 top-4 font-mono text-xs font-bold animate-pulse">
                                            SCANNING...
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Controls Area */}
                            <div className="flex flex-col sm:flex-row gap-4">
                                <div className="flex-1">
                                    <label className="block font-mono text-xs font-bold mb-2 uppercase">Output Format</label>
                                    <div className="relative">
                                        <select
                                            className="w-full input-brutal p-4 font-mono text-sm appearance-none cursor-pointer rounded-none"
                                            value={quality}
                                            onChange={e => setQuality(e.target.value)}
                                        >
                                            <option value="mp3">MP3 / STANDARD / 192K</option>
                                            <option value="flac">FLAC / LOSSLESS / HI-FI</option>
                                        </select>
                                        <div className="absolute right-4 top-4 pointer-events-none">▼</div>
                                    </div>
                                </div>
                                <div className="flex-[1.5] flex items-end">
                                    <button
                                        onClick={startDownload}
                                        disabled={!url.trim() || downloading}
                                        className="w-full bg-retro-accent text-white font-display font-bold text-xl uppercase p-4 btn-brutal disabled:bg-gray-400 disabled:text-gray-200 disabled:border-gray-500 disabled:shadow-none disabled:transform-none cursor-pointer"
                                    >
                                        {downloading ? 'Engaged' : '----EXTRACT----'}
                                    </button>
                                </div>
                            </div>

                            {/* Metadata Display */}
                            {meta && (
                                <div className="border-2 border-retro-text p-4 bg-[#e4e6dc] flex items-center gap-4 mt-8">
                                    {meta.thumbnail ? (
                                        <img src={meta.thumbnail} className="w-20 h-20 border-2 border-retro-text object-cover filter contrast-125 saturate-50" alt="Cover" />
                                    ) : (
                                        <div className="w-20 h-20 border-2 border-retro-text flex items-center justify-center font-mono text-[10px] text-center p-1">NO IMAGE</div>
                                    )}
                                    <div className="min-w-0 font-mono flex-grow">
                                        <div className="flex justify-between border-b-2 border-retro-text border-dotted pb-1 mb-1">
                                            <span className="text-[10px] font-bold">TITLE:</span>
                                            <span className="text-xs font-bold truncate ml-2">{meta.title}</span>
                                        </div>
                                        <div className="flex justify-between border-b-2 border-retro-text border-dotted pb-1 mb-1">
                                            <span className="text-[10px] font-bold">ARTIST:</span>
                                            <span className="text-xs truncate ml-2">{meta.artist}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-[10px] font-bold">DUR:</span>
                                            <span className="text-xs ml-2">{Math.floor(meta.duration/60)}:{meta.duration%60 < 10 ? '0' : ''}{meta.duration%60}</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Progress Bar */}
                            {(downloading || progress > 0) && (
                                <div className="mt-6 border-2 border-retro-text p-2 bg-[#e4e6dc]">
                                    <div className="flex justify-between font-mono text-[10px] font-bold mb-1 uppercase">
                                        <span>STATUS: {status}</span>
                                        <span>{Math.floor(progress)}%</span>
                                    </div>
                                    <div className="w-full h-6 border-2 border-retro-text bg-white relative overflow-hidden">
                                        {/* Solid black fill */}
                                        <div 
                                            className="h-full bg-retro-text absolute top-0 left-0 transition-all duration-300"
                                            style={{ width: `${progress}%` }}
                                        />
                                        {/* Stripes overlay while active */}
                                        {downloading && (
                                            <div 
                                                className="h-full stripes absolute top-0 left-0 transition-all duration-300 pointer-events-none mix-blend-difference opacity-50"
                                                style={{ width: `${progress}%` }}
                                            />
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Error Display */}
                            {error && (
                                <div className="mt-4 border-2 border-retro-text p-3 bg-retro-text text-white font-mono text-xs font-bold text-center uppercase">
                                    ! ERROR: {error} !
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
