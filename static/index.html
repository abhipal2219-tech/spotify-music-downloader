<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Downloader</title>
    <meta name="description" content="Download your favorite Spotify tracks in MP3 or FLAC quality.">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        spotify: { green: '#1DB954', dark: '#121212', card: '#181818', hover: '#282828', light: '#b3b3b3' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
        @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
        .shimmer { background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.06) 50%, transparent 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
        .fade-up { animation: fadeUp .4s ease-out forwards; }
        @keyframes pulse-bar { 0%,100%{opacity:1} 50%{opacity:.7} }
        .pulse-bar { animation: pulse-bar 2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-spotify-dark text-white min-h-screen flex flex-col items-center justify-center p-4 selection:bg-spotify-green/30">
    <div id="root" class="w-full max-w-xl"></div>

    <script type="text/babel">
        const { useState, useCallback } = React;

        const API = window.location.origin;

        function App() {
            const [url, setUrl] = useState('');
            const [quality, setQuality] = useState('mp3');
            const [meta, setMeta] = useState(null);
            const [fetching, setFetching] = useState(false);
            const [downloading, setDownloading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [status, setStatus] = useState('');
            const [error, setError] = useState('');

            const fetchMeta = useCallback(async () => {
                if (!url.trim()) return;
                setFetching(true); setMeta(null); setError('');
                try {
                    const r = await fetch(`${API}/metadata?url=${encodeURIComponent(url)}`);
                    if (r.ok) { setMeta(await r.json()); }
                    else { setError('Could not fetch metadata. Check the URL or add Spotify credentials.'); }
                } catch { setError('Server unreachable.'); }
                finally { setFetching(false); }
            }, [url]);

            const startDownload = () => {
                setDownloading(true); setProgress(0); setStatus('Connecting…'); setError('');
                const es = new EventSource(`${API}/download?url=${encodeURIComponent(url)}&quality=${quality}`);
                es.onmessage = (e) => {
                    const d = JSON.parse(e.data);
                    if (d.status === 'downloading') { setProgress(d.progress); setStatus(`Downloading ${d.progress.toFixed(1)}%`); }
                    else if (d.status === 'finished') { setProgress(100); setStatus('Converting audio…'); }
                    else if (d.status === 'complete') { setStatus('Done! ✓'); setDownloading(false); es.close(); }
                };
                es.onerror = () => { setError('Download failed.'); setDownloading(false); es.close(); };
            };

            return (
                <div className="space-y-6 fade-up">
                    {/* Header */}
                    <div className="text-center mb-2">
                        <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight">
                            <span className="text-white">Spotify </span>
                            <span className="text-spotify-green">Downloader</span>
                        </h1>
                        <p className="text-spotify-light text-sm mt-1">Paste a Spotify or YouTube URL to get started</p>
                    </div>

                    {/* Card */}
                    <div className="glass rounded-2xl p-6 space-y-5">
                        {/* URL input */}
                        <div className="relative">
                            <input
                                id="url-input"
                                type="text"
                                placeholder="https://open.spotify.com/track/..."
                                className="w-full bg-spotify-card rounded-xl py-3.5 px-5 pr-12 text-sm outline-none focus:ring-2 focus:ring-spotify-green/60 transition placeholder:text-spotify-light/50"
                                value={url}
                                onChange={e => setUrl(e.target.value)}
                                onBlur={fetchMeta}
                                onKeyDown={e => e.key === 'Enter' && fetchMeta()}
                            />
                            {fetching && (
                                <div className="absolute right-4 top-3.5">
                                    <div className="w-5 h-5 border-2 border-spotify-green border-t-transparent rounded-full animate-spin" />
                                </div>
                            )}
                        </div>

                        {/* Quality + Download */}
                        <div className="flex gap-3">
                            <select
                                id="quality-select"
                                className="flex-1 bg-spotify-card rounded-xl py-3.5 px-4 text-sm outline-none focus:ring-2 focus:ring-spotify-green/60 appearance-none cursor-pointer"
                                value={quality}
                                onChange={e => setQuality(e.target.value)}
                            >
                                <option value="mp3">MP3 · 192 kbps</option>
                                <option value="flac">FLAC · Lossless</option>
                            </select>
                            <button
                                id="download-btn"
                                onClick={startDownload}
                                disabled={!url.trim() || downloading}
                                className="flex-[2] bg-spotify-green hover:brightness-110 active:scale-[.97] disabled:opacity-40 disabled:cursor-not-allowed text-black font-semibold py-3.5 px-6 rounded-xl transition-all text-sm"
                            >
                                {downloading ? 'Downloading…' : 'Download'}
                            </button>
                        </div>

                        {/* Metadata */}
                        {meta && (
                            <div className="flex items-center gap-4 p-3 bg-spotify-card rounded-xl fade-up">
                                {meta.thumbnail && <img src={meta.thumbnail} className="w-16 h-16 rounded-lg object-cover shadow" alt="Cover" />}
                                <div className="min-w-0">
                                    <p className="font-semibold text-sm truncate">{meta.title}</p>
                                    <p className="text-spotify-light text-xs truncate">{meta.artist}</p>
                                </div>
                            </div>
                        )}

                        {/* Progress */}
                        {(downloading || progress > 0) && (
                            <div className="space-y-2 fade-up">
                                <div className="w-full bg-spotify-card rounded-full h-2 overflow-hidden">
                                    <div
                                        className={`h-full rounded-full transition-all duration-300 ${downloading ? 'pulse-bar' : ''}`}
                                        style={{ width: `${progress}%`, background: 'linear-gradient(90deg, #1DB954, #1ed760)' }}
                                    />
                                </div>
                                <p className="text-center text-xs font-medium text-spotify-green">{status}</p>
                            </div>
                        )}

                        {/* Error */}
                        {error && <p className="text-red-400 text-xs text-center fade-up">{error}</p>}
                    </div>

                    <p className="text-center text-[10px] text-spotify-light/40">For personal use only</p>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
