<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Downloader</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .spotify-green { color: #1DB954; }
        .bg-spotify-green { background-color: #1DB954; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-2xl"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [url, setUrl] = useState('');
            const [quality, setQuality] = useState('mp3');
            const [metadata, setMetadata] = useState(null);
            const [loading, setLoading] = useState(false);
            const [downloading, setDownloading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [status, setStatus] = useState('');

            const fetchMetadata = async () => {
                if (!url) return;
                setLoading(true);
                setMetadata(null);
                try {
                    const res = await fetch(`http://localhost:8000/metadata?url=${encodeURIComponent(url)}`);
                    if (res.ok) {
                        const data = await res.json();
                        setMetadata(data);
                    } else {
                        alert('Could not fetch metadata. Please check the URL.');
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            const handleDownload = () => {
                setDownloading(true);
                setProgress(0);
                setStatus('Starting download...');
                
                const eventSource = new EventSource(`http://localhost:8000/download?url=${encodeURIComponent(url)}&quality=${quality}`);
                
                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.status === 'downloading') {
                        setProgress(data.progress);
                        setStatus(`Downloading... ${data.progress}%`);
                    } else if (data.status === 'finished') {
                        setProgress(100);
                        setStatus('Processing audio...');
                    } else if (data.status === 'complete') {
                        setStatus('Download complete! Check the downloads folder.');
                        setDownloading(false);
                        eventSource.close();
                    }
                };

                eventSource.onerror = (err) => {
                    console.error('EventSource failed:', err);
                    setStatus('Download failed.');
                    setDownloading(false);
                    eventSource.close();
                };
            };

            return (
                <div class="glass p-8 rounded-3xl shadow-2xl space-y-8">
                    <div class="text-center">
                        <h1 class="text-4xl font-bold mb-2">Spotify <span class="spotify-green">Downloader</span></h1>
                        <p class="text-gray-400">Download your favorite tracks in high quality</p>
                    </div>

                    <div class="space-y-4">
                        <div class="relative">
                            <input 
                                type="text" 
                                placeholder="Paste Spotify Track URL here..." 
                                class="w-full bg-[#242424] border-none rounded-2xl py-4 px-6 focus:ring-2 focus:ring-[#1DB954] outline-none transition-all"
                                value={url}
                                onChange={(e) => setUrl(e.target.value)}
                                onBlur={fetchMetadata}
                            />
                            {loading && (
                                <div class="absolute right-4 top-4">
                                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-[#1DB954]"></div>
                                </div>
                            )}
                        </div>

                        <div class="flex gap-4">
                            <select 
                                class="flex-1 bg-[#242424] border-none rounded-2xl py-4 px-6 focus:ring-2 focus:ring-[#1DB954] outline-none appearance-none"
                                value={quality}
                                onChange={(e) => setQuality(e.target.value)}
                            >
                                <option value="mp3">Quality: MP3 (192kbps)</option>
                                <option value="flac">Quality: FLAC (Lossless)</option>
                            </select>
                            <button 
                                onClick={handleDownload}
                                disabled={!metadata || downloading}
                                class="flex-[2] bg-spotify-green hover:bg-[#1ed760] disabled:opacity-50 disabled:cursor-not-allowed text-black font-bold py-4 px-8 rounded-2xl transition-all shadow-lg active:scale-95"
                            >
                                {downloading ? 'Downloading...' : 'Download Now'}
                            </button>
                        </div>
                    </div>

                    {metadata && (
                        <div class="flex items-center gap-6 p-4 bg-[#1a1a1a] rounded-2xl animate-fade-in">
                            <img src={metadata.thumbnail} class="w-24 h-24 rounded-xl shadow-md" alt="Album Art" />
                            <div class="flex-1 overflow-hidden">
                                <h2 class="text-xl font-bold truncate">{metadata.title}</h2>
                                <p class="text-gray-400 truncate">{metadata.artist}</p>
                            </div>
                        </div>
                    )}

                    {(downloading || progress > 0) && (
                        <div class="space-y-4">
                            <div class="w-full bg-[#242424] rounded-full h-3 overflow-hidden">
                                <div 
                                    class="bg-spotify-green h-full transition-all duration-300 ease-out"
                                    style={{ width: `${progress}%` }}
                                ></div>
                            </div>
                            <p class="text-center text-sm font-medium spotify-green">{status}</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
